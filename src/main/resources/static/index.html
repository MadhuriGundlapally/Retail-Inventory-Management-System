<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail inventory</title>
<style>
  :root { --bg:#f6f4ef; --ink:#1d2a33; --muted:#66737c; --line:#d9d4c8; --accent:#1f5f8b; --warn:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a1f; --ink:#e7edf1; --muted:#93a1ab; --line:#2b3640; --accent:#6db3e0; --warn:#ff8a80; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:900px; margin:0 auto; padding:24px 16px; }
  h1 { margin:0 0 16px; font-size:1.5rem; }
  form { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-bottom:16px; }
  input,button { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); padding:4px 10px; }
  table { width:100%; border-collapse:collapse; overflow-x:auto; display:block; }
  th,td { text-align:left; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .low { color:var(--warn); font-weight:600; }
  #msg { min-height:1.5em; color:var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Retail inventory</h1>
  <form id="add">
    <input name="sku" placeholder="SKU" required>
    <input name="name" placeholder="Name" required>
    <input name="category" placeholder="Category">
    <input name="price" type="number" step="0.01" min="0" placeholder="Price" required>
    <input name="initialQuantity" type="number" min="0" placeholder="Quantity">
    <input name="reorderLevel" type="number" min="0" placeholder="Reorder level">
    <button>Add product</button>
  </form>
  <p id="msg" role="alert"></p>
  <table>
    <thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Price</th><th>Qty</th><th>Adjust</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
const msg = document.getElementById("msg");
async function api(path, opts = {}) {
  const res = await fetch("/api" + path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (res.status === 204) return null;
  const body = await res.json();
  if (!res.ok) throw new Error((body.details || [body.error]).join("; "));
  return body;
}
function cell(text, cls) { const td = document.createElement("td"); td.textContent = text; if (cls) td.className = cls; return td; }
async function load() {
  const rows = document.getElementById("rows");
  rows.replaceChildren();
  for (const p of await api("/products")) {
    const tr = document.createElement("tr");
    tr.append(cell(p.sku), cell(p.name), cell(p.category || ""), cell(p.price.toFixed(2)),
              cell(p.quantity, p.quantity <= p.reorderLevel ? "low" : ""));
    const adj = document.createElement("td");
    for (const d of [-1, 1]) {
      const b = document.createElement("button"); b.className = "ghost"; b.textContent = d > 0 ? "+1" : "-1";
      b.onclick = () => run(() => api(`/stock/${p.id}/adjust`, { method: "POST", body: JSON.stringify({ delta: d, reason: "manual" }) }));
      adj.append(b);
    }
    const del = document.createElement("td");
    const x = document.createElement("button"); x.className = "ghost"; x.textContent = "Delete";
    x.onclick = () => confirm(`Delete ${p.sku}?`) && run(() => api(`/products/${p.id}`, { method: "DELETE" }));
    del.append(x);
    tr.append(adj, del);
    rows.append(tr);
  }
}
async function run(fn) { msg.textContent = ""; try { await fn(); await load(); } catch (e) { msg.textContent = e.message; } }
document.getElementById("add").onsubmit = (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const body = { sku: f.sku, name: f.name, category: f.category, price: Number(f.price),
    initialQuantity: f.initialQuantity === "" ? 0 : Number(f.initialQuantity),
    reorderLevel: f.reorderLevel === "" ? 0 : Number(f.reorderLevel) };
  run(async () => { await api("/products", { method: "POST", body: JSON.stringify(body) }); e.target.reset(); });
};
run(async () => {});
</script>
</body>
</html>
